name: Release

# Every push to main whose plugin version has no release yet builds hastan.zip
# and publishes it as release v<version>; WordPress picks it up as an update.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: hastan

      - name: Read version
        id: version
        run: |
          version=$(sed -n "s/^ \* Version: *//p" hastan/hastan.php)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: shivammathur/setup-php@v2
        if: steps.version.outputs.exists != 'true'
        with:
          php-version: '8.1'
          tools: composer

      - name: Install dependencies
        if: steps.version.outputs.exists != 'true'
        working-directory: hastan
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Build zip
        if: steps.version.outputs.exists != 'true'
        run: |
          rm -rf hastan/.git hastan/.github
          find hastan/vendor -maxdepth 3 -type d \( -name tests -o -name examples -o -name fixtures -o -name docs \) -prune -exec rm -rf {} +
          zip -qr9 hastan.zip hastan

      - uses: softprops/action-gh-release@v2
        if: steps.version.outputs.exists != 'true'
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Hastan ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: hastan.zip
